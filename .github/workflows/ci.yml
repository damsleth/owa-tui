name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # owa-tools ships via GitHub Releases, not PyPI (PyPI stops at 1.6.0).
          # Keep this tag >= the owa-tools lower bound in pyproject.toml.
          pip install "owa-tools @ git+https://github.com/damsleth/owa-tools@v1.9.0"
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests with coverage
        run: pytest -q --cov --cov-fail-under=85
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: E2E (tui-test, fixture mode)
        run: |
          npm ci
          npx tui-test
      - name: Build package
        run: uv build
