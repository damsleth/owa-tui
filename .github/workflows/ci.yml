name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # owa-tools ships via GitHub Releases, not PyPI (PyPI stops at 1.6.0).
          # Keep this tag >= the owa-tools lower bound in pyproject.toml.
          pip install "owa-tools @ git+https://github.com/damsleth/owa-tools@v1.7.0"
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests with coverage
        run: pytest -q --cov --cov-fail-under=85
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: E2E (tui-test, fixture mode)
        run: |
          npm ci
          npx tui-test
      - name: Build package
        run: uv build
